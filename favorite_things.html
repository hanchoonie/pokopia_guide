<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有物品 | Pokopia Guide</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rajdhani:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div id="layoutRoot"></div>

    <main class="items-page">
        <div class="items-toolbar">
            <input id="itemSearch" type="text" placeholder="搜尋物品名稱 / 類別 / 標籤">
            <select id="itemFilterType">
                <option value="">全部</option>
                <option value="categories">類別</option>
                <option value="tags">標籤</option>
            </select>
            <button id="clearAllFiltersBtn" class="btn danger">清除全部</button>
        </div>

        <div id="selectedFilters" class="selected-filters" style="display:none;"></div>
        <div id="itemFilterBar" class="items-filter-bar" style="display:none;"></div>
        <div id="itemsGrid" class="items-grid"></div>
    </main>

    <script src="js/shared/constants.js"></script>
    <script src="js/shared/utils.js"></script>
    <script src="js/shared/layout.js"></script>
    <script src="js/shared/favorite_things_data.js"></script>
    <script src="js/pages/favorite_things.js"></script>
</body>

</html>
